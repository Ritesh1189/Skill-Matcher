spring.application.name=skill-match-portal
server.port=${PORT:8080}

# MongoDB Atlas Connection
# Format: mongodb+srv://<username>:<password>@<cluster-url>/<dbname>?retryWrites=true&w=majority
# Can be overridden via environment variable MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skillmatch_db?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}

# Swagger UI / OpenAPI 3 Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.com.skillmatch=INFO
logging.level.org.springframework.data.mongodb=WARN
