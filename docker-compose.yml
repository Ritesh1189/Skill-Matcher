version: '3.8'

services:
  # MongoDB Atlas / Local MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: skillmatch-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skillmatch_db
    volumes:
      - mongo_data:/data/db

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillmatch-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/skillmatch_db
    depends_on:
      - mongodb

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillmatch-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
